[package]
name = "brotli-wasm"
version = "1.0.0"
description = "A compressor and decompressor for Brotli that actually works, for node & browsers"
repository = "https://github.com/httptoolkit/brotli-wasm"
authors = ["Tim Perry <tim@httptoolkit.tech>"]
edition = "2018"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[profile.release]
lto = true
opt-level = 's'

[dependencies]
wasm-bindgen = "0.2.108"
brotli = "8"
console_error_panic_hook = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Locally patched copy of brotli 8.0.4. The upstream crate (latest on crates.io is
# 8.0.4) panics when compressing certain payloads with a custom dictionary at qualities
# 5-9 (see brotli_bugfix.md). Remove this patch once an upstream release ships the fix.
[patch.crates-io]
brotli = { path = "vendor/brotli" }
